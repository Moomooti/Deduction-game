<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수프를 끓이는 동안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 가스불 하나 켜진 어두운 부엌(메인) → 단일 컬럼 사건 파일(게임) + 오른쪽 채팅 서랍. 의도적으로 어두운 단일 테마 */
:root{
  color-scheme:dark;
  --paper:#0c0f15; --glow:#1b2435; --card:#171c26; --ink:#eef0f4; --muted:#a6acba; --line:#2f3747;
  --hl:#d9b44f; --hl-ink:#0c0f15; --no:#f06b59; --yes:#5fd0a2; --meh:#aeb1c4; --chip:#202734;
  --a-meter:#f0a94e; --a-ask:#6fa8ff; --a-key:#5fd0a2; --a-log:#b893ff; --a-hint:#5fc8d8;
  --bulb:#ffe2a0; --warm:rgba(255,200,110,.16);
  --title:"Song Myung","Nanum Myeongjo",serif;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  background:radial-gradient(120% 70% at 50% -10%,var(--glow),transparent 60%),radial-gradient(140% 100% at 50% 50%,transparent 55%,#000 100%),var(--paper);
  background-attachment:fixed}
body.big{font-size:17px}
body.horror{--paper:#0a0607;--glow:#3a0c12;--card:#1a1113;--line:#3a2328;--muted:#b19ca1;--chip:#24171a;--hl:#d8323d;--hl-ink:#ffffff}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

/* ---------- 메인: 어두운 부엌과 가스레인지 ---------- */
.stage{position:relative;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden;
  padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#000;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.pool{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease-out;
  background:radial-gradient(55% 42% at 50% 64%,rgba(255,150,70,.20),rgba(70,110,255,.05) 55%,transparent 78%)}
.stage.lit .pool{opacity:1}
.stage-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.stove{position:relative;width:min(300px,72vw)}
.stove svg{display:block;width:100%;height:auto;overflow:visible}
.heat,.soup-hot{opacity:0;transition:opacity 2.4s .3s ease-out}
.stage.lit .heat,.stage.lit .soup-hot{opacity:1}
.flames{opacity:0}
.stage.lit .flames{opacity:1}
.flame{transform-box:fill-box;transform-origin:50% 100%}
.stage.lit .flame{animation:flick .2s infinite alternate ease-in-out}
.stage.lit .flame:nth-child(2n){animation-duration:.26s}.stage.lit .flame:nth-child(3n){animation-duration:.31s}
@keyframes flick{from{transform:scaleY(.82) scaleX(.95)}to{transform:scaleY(1.1) scaleX(1.03)}}
.stage.lighting .flames{animation:ignite 1s steps(1,end)}
body.noflick .stage.lighting .flames{animation:fadeon .6s ease-out}
@keyframes ignite{0%{opacity:0}14%{opacity:1}22%{opacity:0}34%{opacity:1}100%{opacity:1}}
@keyframes fadeon{from{opacity:0}to{opacity:1}}
.bubble{opacity:0;transform-box:fill-box;transform-origin:center}
.stage.lit .bubble{animation:boil 1.7s infinite ease-in}
@keyframes boil{0%{opacity:0;transform:scale(.2)}55%{opacity:.95;transform:scale(1)}80%{opacity:.9;transform:scale(1.15)}100%{opacity:0;transform:scale(1.35)}}
.steam{position:absolute;left:0;right:0;top:-40%;height:75%;pointer-events:none}
.steam i{position:absolute;bottom:0;width:26%;height:55%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,222,.30),transparent);filter:blur(10px);opacity:0}
.steam i:nth-child(1){left:18%}.steam i:nth-child(2){left:38%}.steam i:nth-child(3){left:56%}.steam i:nth-child(4){left:30%}
.stage.lit .steam i{animation:steam 4.2s infinite ease-out}
.stage.lit .steam i:nth-child(1){animation-delay:1.6s}.stage.lit .steam i:nth-child(2){animation-delay:2.6s}
.stage.lit .steam i:nth-child(3){animation-delay:3.4s}.stage.lit .steam i:nth-child(4){animation-delay:4.3s}
@keyframes steam{0%{opacity:0;transform:translateY(20%) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(12%,-120%) scale(1.6)}}
.knob{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px}
.dial{position:relative;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#50535b,#1c1e23 70%);border:1px solid #3a3d45;
  box-shadow:0 6px 20px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.08);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.dial::before{content:"";position:absolute;left:50%;top:8px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:#8a8e97}
.knob.turn .dial{transform:rotate(-90deg)}
.sw-label{font-size:13px;letter-spacing:2px;color:#6d717c}
.knob:hover .sw-label{color:#a3a7b2}
.knob:hover .dial{border-color:#5a5e68}
.stage:not(.lit) .title{visibility:hidden}
.title{font-family:var(--title);font-weight:400;font-size:clamp(34px,8.5vw,64px);line-height:1.15;margin:0;color:#f3e6c8;letter-spacing:1px;text-wrap:balance;
  text-shadow:0 0 24px rgba(255,200,120,.25)}
.stage.lighting .title{animation:rise 1.1s 1.1s both ease-out}
.menu{display:flex;flex-direction:column;gap:4px;align-items:center}
.menu button{background:none;border:0;cursor:pointer;font-family:var(--display);font-size:24px;color:#cfc7b4;padding:6px 18px;position:relative;letter-spacing:1px}
.menu button::before{content:"";position:absolute;left:50%;bottom:6px;width:0;height:1px;background:var(--bulb);transition:width .25s,left .25s}
.menu button:hover:not(:disabled)::before,.menu button:focus-visible::before{width:70%;left:15%}
.menu button:hover:not(:disabled){color:#fff3d6}
.menu button:disabled{color:#4d4f57;cursor:default}
.menu small{display:block;font-family:var(--body);font-size:12px;color:#6d717c;letter-spacing:0}
.stage.lighting .menu button{animation:rise .6s both ease-out}
.stage.lighting .menu button:nth-child(1){animation-delay:1.2s}.stage.lighting .menu button:nth-child(2){animation-delay:1.3s}
.stage.lighting .menu button:nth-child(3){animation-delay:1.4s}.stage.lighting .menu button:nth-child(4){animation-delay:1.5s}
.small-link{background:none;border:0;cursor:pointer;font-size:13px;color:#7b7f8a;text-decoration:underline;text-underline-offset:3px}
.stage.lighting .small-link{animation:rise .6s 1.7s both ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 공통 화면 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{background:none;border:0;cursor:pointer;font-family:var(--title);font-size:19px;color:#f3e6c8;padding:0}
.top-r{display:flex;gap:8px;align-items:center}
.wrap{max-width:760px;margin:0 auto;padding-block:22px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.h2{font-family:var(--title);font-weight:400;font-size:30px;line-height:1.2;margin:0;color:#f3e6c8;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.btn{font-weight:700;color:var(--paper);background:var(--ink);border:0;border-radius:6px;padding:11px 18px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:13.5px;padding:8px 14px}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
.btn.hl{background:var(--hl);color:var(--hl-ink)}
.notice{background:var(--chip);border-radius:6px;padding:12px 14px;font-size:13.5px;margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:13px;letter-spacing:1.5px;color:var(--muted);font-weight:700}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-weight:700;color:var(--hl-ink);background:var(--hl);padding:1px 8px;border-radius:3px;letter-spacing:.5px;font-size:12px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.genres{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.genre{background:transparent;border:0;padding:10px;cursor:pointer;font-family:var(--display);font-size:22px}
.genre + .genre{border-left:1.5px solid var(--ink)}
.genre[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.casecard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.casecard:hover{border-color:var(--hl);transform:translateY(-1px)}
.casecard .no{font-family:var(--mono);font-size:12px;color:var(--hl);font-weight:600}
.casecard .ct{font-family:var(--display);font-size:19px;line-height:1.3}
.casecard .cs{font-size:12.5px;color:var(--muted)}
.casecard.soon{opacity:.45;cursor:default}.casecard.soon:hover{border-color:var(--line);transform:none}
.soon-tag{font-family:var(--body);font-size:12px;opacity:.7;vertical-align:middle}
.casecard .cs.ok{color:var(--yes)}.casecard .cs.bad{color:var(--no)}

/* ---------- 게임 ---------- */
.roombar{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--chip)}
.rb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.rb-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.code{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:3px;color:var(--hl)}
.faces{display:flex}
.faces img,.faces .ph{width:26px;height:26px;border-radius:50%;border:2px solid var(--chip);margin-left:-6px;background:#333;object-fit:cover}
.faces :first-child{margin-left:0}
.ph{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#d8cfbb}
.asking{font-size:12.5px;color:var(--muted)}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.seats{display:flex;gap:6px;flex-wrap:wrap}
.roles{display:flex;flex-direction:column;gap:6px}
.rolec{display:flex;gap:12px;align-items:center;text-align:left;background:var(--chip);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;min-width:0}
.rolec b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.2;flex:none;min-width:5.2em;white-space:nowrap}
.rolec small{font-size:11.5px;color:var(--muted);line-height:1.35}
.rolec:hover:not(:disabled){border-color:var(--muted)}
.rolec.sel{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 14%,var(--chip))}
.rolec.sel b{color:var(--hl)}
.rolec:disabled{opacity:.45;cursor:default}
.pick-h{margin:4px 0 0;font-size:13px;color:var(--ink)!important}
.seat{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.seat b{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.seat.on{color:var(--ink)}.seat.on b{background:var(--hl);color:var(--hl-ink)}
.seat.me{border-color:var(--hl)}
.seat.empty{border-style:dashed}
.lobby{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:stretch}
.lobby .h2{font-size:28px}
.lobby-case{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lobby-case b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink)}
.lobby-case select{max-width:360px;width:100%}
.lobby-inv{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:14px}
.lobby-inv .actions{justify-content:center}
.wseats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.wseats{grid-template-columns:1fr}}
.wseat{display:flex;flex-direction:column;gap:4px;align-items:center;padding:14px 10px;border:1.5px dashed var(--line);border-radius:8px;min-width:0}
.wseat.in{border-style:solid;background:var(--chip)}
.wseat.me{border-color:var(--hl)}
.wrole{font-family:var(--display);font-size:20px;color:var(--muted)}
.wseat.in .wrole{color:var(--hl)}
.wname{font-size:15px;font-weight:700;word-break:break-all}
.wseat:not(.in) .wname{font-weight:400;color:var(--muted)}
.wst{font-size:12px;color:var(--muted)}
.w-go{align-self:center;min-width:220px;font-size:16px;padding:13px 22px}
.w-note,.w-wait{margin:0;font-size:13px;color:var(--muted)}
.w-warn{margin:0;font-size:12.5px;color:var(--hl)}
.w-wait{display:flex;gap:8px;align-items:center;justify-content:center}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--hl);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.w-foot{justify-content:center}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:75;background:var(--card);border:1px solid var(--hl);color:#f3e6c8;font-family:var(--title);font-size:24px;padding:14px 26px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fxin .3s ease-out both}
.toast.out{animation:fxout .6s ease-in both}
.invite{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;animation:fxin .3s ease-out both}
.invite-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.invite-card h3{margin:0;font-family:var(--title);font-weight:400;font-size:28px;color:#f3e6c8}
.inv-k{margin:0;font-size:13px;color:var(--muted)}.inv-k b{color:var(--hl)}
.inv-p{margin:0;font-size:13.5px;color:var(--muted)}
.inv-code{display:flex;justify-content:center;gap:8px;margin:8px 0 0}
.inv-code span{width:52px;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:32px;color:var(--hl);background:var(--chip);border:1px solid var(--line);border-radius:8px}
.inv-n{margin:0;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.invite-card .actions{justify-content:center}
.inv-go{margin-top:4px}
select,.field{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0}
select{max-width:100%}

.case{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px}
.case h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.25;margin:0;text-wrap:balance}
.story{margin:0;font-size:1.07em;max-width:62ch}
.mission{margin:0;font-size:13.5px;color:var(--muted)}
.mission b{color:var(--ink)}

.meterbox{display:flex;flex-direction:column;gap:8px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line);margin:4px 0 20px}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--hl);transition:width .3s}
.meter.danger .fill{background:var(--no)}
.tick{position:absolute;top:-4px;width:2px;height:16px;background:var(--muted);transform:translateX(-1px)}
.tick.on{background:var(--hl)}
.tick i{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.tick.end{background:var(--no)}.tick.end i{left:auto;right:0;transform:none;color:var(--no)}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:620px){.hints{grid-template-columns:1fr}}
.hint{border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.hint .n{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:1px}
.hint.on{border-style:solid;border-color:var(--hl);color:var(--ink);background:var(--card)}
.hint.on .n{color:var(--hl)}
.hints.media{grid-template-columns:1fr}
.sms{display:flex;flex-direction:column;gap:8px;background:#0b0d12;border-radius:12px;padding:14px;max-width:420px}
.bub{display:flex;flex-direction:column;gap:2px;max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5}
.bub b{font-size:11.5px;font-weight:700;opacity:.75}
.bub.in{align-self:flex-start;background:#22262f;color:#e6e8ec;border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:#3b4a63;color:#eef2f8;border-bottom-right-radius:4px}
.shot{display:block;padding:0;border:0;background:none;cursor:zoom-in;border-radius:6px;overflow:hidden;max-width:560px}
.shot img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.zoom img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:4px}
.hint.new{animation:hintin .8s ease-out}
@keyframes hintin{0%{transform:scale(.94);box-shadow:0 0 0 0 var(--hl)}50%{box-shadow:0 0 0 6px transparent}100%{transform:none}}

.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.keys{grid-template-columns:1fr}}
.key{border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start;min-width:0}
.key .n{font-family:var(--mono);font-size:12px;font-weight:600;flex:none;padding-top:1px}
.key.on{border-style:solid;border-color:var(--yes);color:var(--ink);background:var(--card)}
.key.on .n{color:var(--yes)}

.ask{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:6px}

<script>
/* ================= 사건 데이터 ================= */
const CASES = [
{g:"crime",id:"C-0417",title:"원샷한 부장은 살았다",
 story:"회식 자리에서 부장과 과장은 같은 병으로 만든 하이볼을 한 잔씩 받았다. 부장은 받자마자 원샷했고, 과장은 이야기하면서 천천히 마셨다. 한 시간 뒤 과장만 쓰러져 숨졌다. 술병에서도, 부장의 잔에서도 독은 나오지 않았다.",
 mission:"<b>미션</b> · 무슨 일이 있었을까? 범인, 동기, 범행 방법을 밝혀내.",
 hostTruth:`범인은 최 대리다.
최 대리는 작업 중 산업재해를 당해 손가락 일부를 잃었다. 그러나 회사는 사고 책임을 피하려고 사건을 대충 처리하고 기록을 축소했다. 부장과 과장은 사고가 제대로 조사되지 않도록 이를 덮는 데 관여했다. 특히 과장은 최 대리의 사고 기록을 축소하고, 최 대리에게 회사에 문제를 제기하지 말라고 압박했다.
최 대리는 두 사람에게 복수하기로 결심했다. 하지만 두 사람을 모두 죽이는 대신, 과장에게 복수하고 부장은 살아남아 사건의 결과와 자신의 책임을 계속 마주하게 만들 계획을 세웠다.
최 대리는 부장이 회식 때 술을 원샷하는 습관을 알고 있었다. 그는 그 습관을 범행 계획에 이용했다. 독은 술 자체나 술병에 들어 있지 않았고, 잔 안의 얼음에 숨겨져 있었다. 이 사건의 독은 얼음이 녹아 술에 충분히 퍼진 뒤에야 위험해지는 가상의 독이다.
부장은 평소처럼 술을 원샷했다. 독이 술에 충분히 퍼지기 전에 잔을 비웠기 때문에 살아남았다. 과장은 천천히 마셨고, 얼음이 녹으면서 독이 퍼진 술을 마셔 숨졌다. 그래서 술병과 부장이 마신 잔에서는 독이 검출되지 않았다.
최 대리는 부장의 원샷 습관과 과장의 느린 음주 습관을 알고 있었고, 이를 이용해 과장만 죽고 부장은 살아남는 결과를 예상했다. 최 대리의 범행 동기는 산업재해 은폐에 대한 복수다.

[핵심 정답]
- 범인: 최 대리
- 피해자: 과장
- 동기: 최 대리가 산업재해로 손가락 일부를 잃었고, 부장과 과장이 사고를 대충 덮은 데 대한 복수
- 독이 들어 있던 곳: 과장의 하이볼에 든 얼음
- 부장이 살아남은 이유: 부장이 원샷해 독이 술에 충분히 퍼지기 전에 잔을 비웠기 때문
- 범행에 사용된 정보: 최 대리는 부장의 원샷 습관과 과장의 느린 음주 습관을 알고 있었다.
- 술병에 독이 없었던 이유: 독은 술병이나 술이 아니라 얼음에 숨겨져 있었다.
- 부장의 잔에서 독이 나오지 않은 이유: 부장이 얼음이 녹기 전에 잔을 비웠기 때문이다.
- 다른 공범이나 범인은 없다.

[질문별 기준 답변]
- 술병에 독이 있었나요? → 아니오.
- 술 자체에 독이 있었나요? → 아니오.
- 잔에 든 얼음이 사건과 관련 있나요? → 예.
- 과장은 얼음이 녹은 술을 마셨나요? → 예.
- 부장은 독이 퍼지기 전에 술을 다 마셨나요? → 예.
- 부장이 원샷하는 습관을 최 대리가 알고 있었나요? → 예.
- 부장은 과장을 죽이려고 했나요? → 아니오.
- 과장이 부장을 죽이려고 했나요? → 아니오.
- 최 대리가 범인인가요? → 예.
- 최 대리에게 범행 동기가 있었나요? → 예.

function derive(idx,log){
  const c=CASES[idx],found=new Set(),used=new Set();let q=0,solved=false,gaveUp=false;
  for(const e of log){(e.found||[]).forEach(n=>{n=Number(n);if(n>=0&&n<c.keys.length)found.add(n)});
    if(e.kind==="q"&&e.answer!=="다시")q++;if(e.kind==="g"&&e.answer==="정답")solved=true;if(e.kind==="giveup")gaveUp=true;
    if(e.kind==="skill"&&Number.isInteger(e.skill))used.add(e.skill)}
  if(found.size===c.keys.length)solved=true;
  const gameOver=!solved&&!gaveUp&&q>=MAXQ;
  const bonus=used.has(0)?1:0;
  return {found,q,solved,gaveUp,gameOver,over:solved||gaveUp||gameOver,used,bonus,hints:Math.min(3,Math.floor(q/HINT_EVERY)+bonus)};
}

async function lookupJoin(raw){

  if(!db){roomMsg="같이 수사하기는 아직 준비 중이야.";S.view="rooms";render();return}
  if(NET==="p2p"&&!P2P.hosts[code]&&!P2P.clients[code]){roomMsg=`${code} 방장에게 연결하는 중…`;statusErr=false;S.view="rooms";render()}
  try{const s=await db.doc("rooms/"+code).get();
    if(!s.exists){joinInfo=null;roomMsg=`${code} 방을 찾을 수 없어.${NET==="p2p"?" 코드가 맞는지, 방장이 창을 켜 두었는지 확인해줘.":""}`;S.view="rooms";render();return}

  }catch(e){roomMsg="방을 불러오지 못했어. 다시 시도해줘.";S.view="rooms";render()}

/* claude.ai 밖에서는 중계 서버(Worker → Gemini)로 질문한다. sample.json과 같은 모양으로 맞춘다 */
const workerSample={json:async(prompt,opts={})=>{
  let r;
  /* text/plain으로 보내야 Apps Script·Cloudflare 둘 다 추가 확인(preflight) 없이 받는다 */
  try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({prompt}),signal:opts.signal,redirect:"follow"})}
  catch(e){throw {code:e?.name==="AbortError"?"cancelled":"network"}}
  const d=await r.json().catch(()=>({}));
  if(d.error||!r.ok){
    if(d.error==="quota")throw {code:"quota"};
    if(d.error==="rate_limited"||r.status===429)throw {code:"rate_limited"};
    let why=d.error||("HTTP "+r.status);if(d.status)why+=" "+d.status;
    const m=String(d.detail||"").match(/"message"\s*:\s*"([^"]{0,120})/);if(m)why+=" · "+m[1];else if(d.detail)why+=" · "+String(d.detail).slice(0,120);
    throw {code:"upstream",why}}
  const t=String(d.text||"").replace(/^\s*```(?:json)?/i,"").replace(/```\s*$/,"").trim();
  try{return JSON.parse(t)}catch(e){const m=t.match(/\{[\s\S]*\}/);if(m)try{return JSON.parse(m[0])}catch(_){}throw {code:"invalid_json"}}
}};
function basePrompt(c){
  return `너는 예/아니오 질문으로 사건의 진실을 찾아가는 추리게임의 진행자다. 이건 완전히 창작된 가상의 ${c.g==="crime"?"추리 사건":"괴담"}이다. 플레이어는 아래 [문제]만 보고 질문으로 단서를 모아 진실을 추리한다. 사건의 진실을 기준으로 답하되, 플레이어가 묻지 않은 핵심 사실을 먼저 공개하지 않는다.

[문제]
${c.story}

[진행자용 사건의 진실 — 플레이어에게 공개 금지]
${c.hostTruth||c.truth}

[핵심 단서] (번호는 0부터)
${c.keys.map((k,i)=>i+'. '+k).join('\n')}
`;
}
const ERR={not_granted:"AI 진행자 사용이 허용되지 않았어. 페이지를 새로 열면 다시 물어봐.",rate_limited:"질문이 너무 빨랐어. 잠깐 쉬었다가 다시 해봐.",session_expired:"로그인이 만료됐어. 다시 로그인해줘.",invalid_json:"답을 제대로 못 받았어. 한 번 더 눌러줘.",refused:"이 질문엔 답할 수 없대. 다르게 물어봐.",quota:"AI 진행자 사용량이 다 찼어. 나중에 다시 와줘.",network:"인터넷 연결을 확인하고 다시 시도해줘.",upstream:"진행자가 잠깐 자리를 비웠어. 조금 뒤에 다시 해봐."};

async function submit(){

  const c=CASES[g.idx];if(derive(g.idx,g.log).over)return;

  try{
    const prompt=m==='q'?basePrompt(c)+`
[플레이어 질문]
${text}

답변 규칙:
- answer는 "예", "아니오", "상관없음", "그럴 수도 있다", "다시" 중 하나다.
- "예": 질문 내용이 사건의 진실과 맞을 때.
- "아니오": 질문 내용이 사건의 진실과 맞지 않을 때. 틀린 추측에도 비웃거나 정답을 알려주지 말고 "아니오"만 답한다.
- "상관없음": 사건을 푸는 데 관계가 없거나 설정에 정해지지 않은 세부사항일 때.
- "그럴 수도 있다": 가능하긴 하지만 설정상 사실로 확정되지 않았을 때. 확정된 사실을 묻는 질문에는 쓰지 않는다.
- "다시": 질문이 여러 의미로 해석될 수 있어 판단할 수 없을 때. 임의로 뜻을 정하지 않는다.
- 기준 답변 목록이 있으면 그와 같은 뜻의 질문에는 같은 답을 한다.
- note는 꼭 필요할 때만 짧은 한 문장(30자 이내). 묻지 않은 단서나 정답을 절대 흘리지 않는다. 보통은 빈 문자열.
- found는 아주 엄격하게 판단한다. 플레이어가 질문 문장 안에서 단서의 핵심 내용을 직접, 구체적으로 말했고 그 답이 "예"일 때만 그 단서 번호를 넣는다.

  예) "제3의 범인이 있나요?" → 범인의 이름을 말하지 않았으므로 "범인은 ○○다" 단서를 넣지 않는다.
  예) "누군가 일부러 죽였나요?" → 방법·이유를 말하지 않았으므로 방법·동기 단서를 넣지 않는다.
- 애매하면 넣지 않는다. 보통은 빈 배열 [] 이다.
JSON 하나만 답해: {"answer":"예","note":"","found":[0]}`
    :basePrompt(c)+`
[플레이어의 추리]
${text}

판정 규칙:
- ${c.solve||"추리가 숨은 진실의 핵심(왜 그런 일이 생겼는지)을 맞혔으면 정답, 방향은 맞는데 중요한 이유가 빠졌으면 거의 맞음."}

JSON 하나만 답해: {"result":"아직","found":[],"comment":"좋은 방향이야, 더 파봐"}`;
    const r=await sample.json(prompt,{modelTier:SET.tier,signal:ctl.signal});
    const norm=x=>String(x).replace(/\s+/g,"");
    const found=(Array.isArray(r?.found)?r.found.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<c.keys.length):[])

      entry={kind:"q",text,answer:a,note:a==="다시"?"어떤 의미로 물어본 건지 조금 더 구체적으로 질문해줘.":String(r?.note||"").slice(0,50),found:a==="예"?found:[]};}
    else{const res=["정답","거의 맞음","아직"].includes(r?.result)?r.result:"아직";entry={kind:"g",text,answer:res,note:String(r?.comment||"").slice(0,60),found}}

    render();
  }finally{R.named?.presence({asking:false}).catch(()=>{});focusInp()}

/* ---------- PeerJS ---------- */
const P2P={hosts:{},clients:{}};
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
const codeOfPath=p=>{let m=String(p).match(/^rooms\/([A-Z0-9]{4})(\/|$)/);if(m)return m[1];m=String(p).match(/^presence\/r-([a-z0-9]{4})(\/|$)/);return m?m[1].toUpperCase():null};
let joiningCode=null;
const activeCode=()=>joiningCode||S.roomCode||joinInfo?.code||pendingJoin||null;
function makeStore(){
  const m=new Map(),subs=new Set();
  return {m,pending:{},
    get:p=>m.has(p)?clone(m.get(p)):null,
    apply(ch){for(const [p,d] of ch){if(d==null)m.delete(p);else m.set(p,d)}subs.forEach(f=>{try{f(ch)}catch(e){console.warn(e)}})},
    list(col){const out=[];for(const [k,v] of m)if(k.startsWith(col+"/")&&!k.slice(col.length+1).includes("/"))out.push({path:k,data:clone(v)});return out},
    sub(f){subs.add(f);return()=>subs.delete(f)}};
}
function hostApply(st,op,path,data){
  if(op==="set"){st.apply([[path,clone(data)]]);return {}}
  if(op==="update"){const cur=st.get(path);if(cur==null)return {error:"not-found"};st.apply([[path,{...cur,...clone(data)}]]);return {}}
  if(op==="delete"){st.apply([[path,null]]);return {}}
  if(op==="add"){const np=path+"/"+rid()+rid();st.apply([[np,clone(data)]]);return {path:np}}
  return {error:"bad-op"};
}
function openPeer(id){return new Promise((ok,no)=>{let done=false;const p=id?new Peer(id,PEER_OPTS):new Peer(PEER_OPTS);
  const t=setTimeout(()=>{if(done)return;done=true;try{p.destroy()}catch(_){}no({type:"timeout"})},12000);
  p.on('open',()=>{if(done)return;done=true;clearTimeout(t);ok(p)});
  p.on('error',e=>{if(done)return;done=true;clearTimeout(t);try{p.destroy()}catch(_){}no(e)})})}
function setupHost(code,peer){
  const st=makeStore();st.peer=peer;st.conns=new Set();P2P.hosts[code]=st;
  const okPath=p=>typeof p==="string"&&p.length<200&&(codeOfPath(p)===code||/^names\/[A-Za-z0-9]{1,40}$/.test(p));
  peer.on('connection',conn=>{
    conn.on('open',()=>st.conns.add(conn));
    conn.on('data',msg=>{
      if(msg?.t==="hello"){conn.uid=String(msg.uid||"").slice(0,40);conn.send({t:"full",data:[...st.m]});return}
      if(msg?.t==="op"){
        const big=JSON.stringify(msg.data??null).length>6000;
        let bad=!okPath(msg.path)||big;
        if(!bad&&msg.path==="rooms/"+code){
          if(msg.op!=="update"&&msg.op!=="set")bad=true;
          else{const cur=st.get(msg.path)||{},nd=msg.op==="set"?(msg.data||{}):{...cur,...(msg.data||{})};
            const hostOnly=["caseIdx","round","started","by"].some(k=>JSON.stringify(cur[k])!==JSON.stringify(nd[k]));
            const oldM=cur.members||{},newM=nd.members||{};
            const added=Object.keys(newM).filter(k=>!(k in oldM)),removed=Object.keys(oldM).filter(k=>!(k in newM));
            if(hostOnly&&conn.uid!==cur.by)bad=true;
            if(added.length&&(cur.started!==false||added.some(k=>k!==conn.uid)||Object.keys(newM).length>MAXP))bad=true;
            if(removed.some(k=>k!==conn.uid))bad=true;}}
        const res=bad?{error:"denied"}:hostApply(st,msg.op,msg.path,msg.data);
        try{conn.send({t:"ack",id:msg.id,res})}catch(e){}}
    });
    const gone=()=>{if(!st.conns.has(conn))return;st.conns.delete(conn);if(conn.uid)st.apply([[`presence/r-${code.toLowerCase()}/peers/${conn.uid}`,null]])};
    conn.on('close',gone);conn.on('error',gone);
  });
  st.sub(changes=>{for(const c of st.conns){try{c.send({t:"patch",changes})}catch(e){}}});
  peer.on('disconnected',()=>{if(!peer.destroyed)try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>console.warn("host peer",e?.type));
  return st;
}
async function p2pHostNew(){
  for(let i=0;i<6;i++){
    const code=Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
    try{const peer=await openPeer(PEER_PREFIX+code);setupHost(code,peer);return code}
    catch(e){if(e?.type!=="unavailable-id")throw e}
  }
  throw {type:"no-code"};
}
function p2pClient(code){
  const ex=P2P.clients[code];if(ex)return ex.ready;
  const st=makeStore();P2P.clients[code]=st;
  st.ready=(async()=>{
    const peer=await openPeer(null);st.peer=peer;
    const conn=peer.connect(PEER_PREFIX+code,{reliable:true});st.conn=conn;
    await new Promise((ok,no)=>{let synced=false;
      const t=setTimeout(()=>no({type:"timeout"}),10000);
      peer.on('error',e=>{if(!synced&&(e?.type==="peer-unavailable"||e?.type==="network")){clearTimeout(t);no(e)}});
      conn.on('open',()=>conn.send({t:"hello",uid:me.id}));
      conn.on('data',msg=>{
        if(msg?.t==="full"){st.m.clear();synced=true;clearTimeout(t);st.apply(msg.data||[]);ok()}
        else if(msg?.t==="patch"&&synced)st.apply(msg.changes||[]);
        else if(msg?.t==="ack"){const f=st.pending[msg.id];if(f){delete st.pending[msg.id];f(msg.res)}}
        else if(msg?.t==="boom")st.boom=true;
      });
      conn.on('close',()=>{if(P2P.clients[code]===st)delete P2P.clients[code];st.closed=true;try{peer.destroy()}catch(_){}if(synced)hostGone(code,st.boom)});
    });
    return st;
  })();
  st.ready.catch(()=>{if(P2P.clients[code]===st)delete P2P.clients[code];try{st.peer?.destroy()}catch(_){}});
  return st.ready;
}
async function storeFor(path){
  const code=codeOfPath(path)||(String(path).startsWith("names/")?activeCode():null);
  if(!code)return null;
  if(P2P.hosts[code])return {local:true,st:P2P.hosts[code]};
  try{return {local:false,st:await p2pClient(code)}}catch(e){return null}
}
function p2pClose(code){
  const h=P2P.hosts[code];if(h){delete P2P.hosts[code];setTimeout(()=>{try{h.peer.destroy()}catch(e){}},400)}
  const c=P2P.clients[code];if(c){delete P2P.clients[code];c.closed=true;setTimeout(()=>{try{c.conn?.close();c.peer?.destroy()}catch(e){}},400)}
}
window.addEventListener('beforeunload',e=>{if(NET==="p2p"&&Object.keys(P2P.hosts).length){e.preventDefault();e.returnValue=""}});
function hostGone(code,boom){if(S.mode==="room"&&S.roomCode===code){leaveRoom();roomMsg=boom?"💥 방장이 방을 폭파했어.":"방장이 나가서 방이 닫혔어.";S.view="rooms";render()}}
function p2pDb(){
  const chk=r=>{if(r?.error)throw {code:r.error==="denied"?"permission-denied":r.error};return r};
  const write=async(op,path,data)=>{const s=await storeFor(path);if(!s)throw {code:"unavailable"};
    if(s.local)return chk(hostApply(s.st,op,path,data));
    return chk(await new Promise((ok,no)=>{const id=rid()+rid();const t=setTimeout(()=>{delete s.st.pending[id];no({code:"timeout"})},8000);
      s.st.pending[id]=r=>{clearTimeout(t);ok(r)};try{s.st.conn.send({t:"op",id,op,path,data:clone(data)})}catch(e){clearTimeout(t);no({code:"unavailable"})}}))};
  const snapDoc=(path,d)=>({id:path.split('/').pop(),exists:d!=null,data:()=>clone(d)});
  const doc=path=>({id:path.split('/').pop(),path,
    get:async()=>{const s=await storeFor(path);return snapDoc(path,s?s.st.get(path):null)},
    set:d=>write("set",path,d).then(()=>{}),
    update:d=>write("update",path,d).then(()=>{}),
    delete:()=>write("delete",path).then(()=>{}),
    onSnapshot(next,err){let un=null,dead=false,last;
      storeFor(path).then(s=>{if(dead)return;if(!s){next(snapDoc(path,null));return}
        const emit=()=>{const d=s.st.get(path),k=JSON.stringify(d??null);if(k!==last){last=k;next(snapDoc(path,d))}};
        emit();un=s.st.sub(ch=>{if(ch.some(([p])=>p===path))emit()})}).catch(e=>err&&err(e));
      return()=>{dead=true;un&&un()}}});
  const query=(path,o,l)=>({
    orderBy:(f,dir)=>query(path,{f,dir:dir||"asc"},l),limit:n=>query(path,o,n),doc:id=>doc(path+"/"+(id||rid()+rid())),
    add:async d=>{const r=await write("add",path,d);return doc(r.path)},
    onSnapshot(next,err){let un=null,dead=false,ids=new Set(),lastK;
      storeFor(path).then(s=>{if(dead||!s)return;
        const emit=()=>{let docs=s.st.list(path);if(o)docs.sort((a,b)=>((a.data[o.f]??0)-(b.data[o.f]??0))*(o.dir==="desc"?-1:1));if(l)docs=docs.slice(0,l);
          const k=JSON.stringify(docs);if(k===lastK)return;lastK=k;
          const snaps=docs.map(d=>snapDoc(d.path,d.data));const ch=snaps.filter(x=>!ids.has(x.id)).map(x=>({type:"added",doc:x}));ids=new Set(snaps.map(x=>x.id));
          next({docs:snaps,docChanges:()=>ch})};
        emit();un=s.st.sub(chs=>{if(chs.some(([p])=>p.startsWith(path+"/")))emit()})}).catch(e=>err&&err(e));
      return()=>{dead=true;un&&un()}}});
  return {doc,collection:p=>query(p)};
}
async function initP2P(){
  if(!window.Peer)await loadScript(`https://unpkg.com/peerjs@${PEER_VER}/dist/peerjs.min.js`);
  db=p2pDb();NET="p2p";setupSelf();

/* ================= 방 (db + room) ================= */
const CODE_CH="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const ROLES=["형사","탐정","프로파일러"],MAXP=ROLES.length;
const hasBatchim=w=>{const c=String(w).charCodeAt(String(w).length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0};
const euro=w=>w+(hasBatchim(w)&&(String(w).charCodeAt(String(w).length-1)-0xAC00)%28!==8?'으로':'로'); // ㄹ받침은 '로'
const iya=w=>w+(hasBatchim(w)?'이야':'야');
const SKILLS=[{icon:"🔦",name:"현장 수색",desc:"다음 힌트를 바로 열어"},{icon:"🗣",name:"목격자 진술",desc:"사건을 본 제3자의 증언 하나를 들어"},{icon:"🧠",name:"프로파일링",desc:"핵심 인물의 심리 분석 한 줄을 받아"}];
const ROLE_DESC=["현장을 뒤지는 사람","숨은 진실을 추리하는 사람","범인의 마음을 읽는 사람"];
const roleOf=id=>{const i=R.doc?.members?.[id];return Number.isInteger(i)?ROLES[i]:""};
const who=id=>{const r=roleOf(id),n=NAMES[id]?.name||(id===me.id?'나':'누군가');return r?`${r} ${n}`:n};
let pendingJoin=null,showInvite=false,createRole=null,joinInfo=null; // joinInfo: {code, mem}
const validCode=c=>/^[A-Z0-9]{4}$/.test(c);
const needName=code=>{if(fbMode&&!user?.name?.()){if(code)pendingJoin=code;roomMsg=code?`먼저 '내 이름'을 정하면 ${code} 방으로 들어갈게.`:"먼저 '내 이름'을 정해줘.";S.view="rooms";render();const ci=document.getElementById('code-in');if(ci&&pendingJoin)ci.value=pendingJoin;document.getElementById('name-in')?.focus();return true}return false};
async function createRoom(){

async function enterRoom(raw,opt={}){
  const code=String(raw||"").trim().toUpperCase();
  if(!validCode(code)){roomMsg="코드는 영문과 숫자 4자리야.";S.view="rooms";render();return}
  if(needName(code))return;
  if(!db){roomMsg="같이 수사하기는 아직 준비 중이야.";S.view="rooms";render();return}
  if(S.roomCode===code&&S.mode==="room"){S.view="game";render();return}
  try{
    const ref=db.doc("rooms/"+code);
    for(let tries=0;;tries++){
      const s=await ref.get();if(!s.exists){roomMsg=`${code} 방을 찾을 수 없어.`;S.view="rooms";render();return}
      const mem={...(s.data().members||{})};
      if(me.id&&me.id in mem)break;
      if(s.data().started!==false){joinInfo=null;roomMsg=`${code} 방은 이미 수사를 시작했어. 시작한 뒤에는 들어갈 수 없어.`;S.view="rooms";render();return}
      const used=Object.values(mem);
      if(used.length>=MAXP){joinInfo=null;roomMsg=`${code} 방은 이미 ${MAXP}명이 꽉 찼어.`;S.view="rooms";render();return}
      if(!Number.isInteger(opt.role)){lookupJoin(code);return}
      if(used.includes(opt.role)){joinInfo={code,mem};ensureNames(Object.keys(mem));roomMsg=`${ROLES[opt.role]} 자리는 방금 다른 사람이 맡았어. 다른 역할을 골라줘.`;S.view="rooms";render();return}
      if(tries>=3){roomMsg="자리를 잡지 못했어. 다시 시도해줘.";S.view="rooms";render();return}
      if(fbMode&&user?.name?.()){joiningCode=code;try{await db.doc("names/"+me.id).set({name:user.name()})}catch(e){}joiningCode=null}
      await ref.update({members:{...mem,[me.id]:opt.role}});
    }
  }catch(e){roomMsg=denied(e)?"방에 들어갈 권한이 없어.":"방을 불러오지 못했어. 다시 시도해줘.";S.view="rooms";render();return}
  leaveRoom();if(opt.invite)showInvite=true;if(fbMode)setTimeout(()=>user?.pushName?.(),0);joinInfo=null;pendingJoin=null;createRole=null;
  if(openRoomsUnsub){openRoomsUnsub();openRoomsUnsub=null}
  C.noteSel=null;S.mode="room";S.roomCode=code;S.view="game";R.code=code;mode="q";statusMsg="";setLast({t:"room",c:code});
  C.room=[];C.loaded.room=false;C.tab="room";C.seen.room=Date.now();
  R.unsubs.push(db.doc("rooms/"+code).onSnapshot(snap=>{
    if(!snap.exists){if(S.roomCode===code){leaveRoom();roomMsg="💥 방장이 방을 폭파했어.";S.view="rooms";render()}return}
    const d=snap.data();if(!Number.isInteger(d.caseIdx)||d.caseIdx<0||d.caseIdx>=CASES.length)return;
    const changed=d.round!==R.round;const wasWaiting=R.doc?.started===false;R.doc=d;
    if(wasWaiting&&d.started!==false){sChime();toast("수사를 시작합니다")}
    if(changed){R.round=d.round;R.log=[];R.logUnsub?.();
      R.logUnsub=db.collection(`rooms/${code}/rounds/${d.round}/log`).orderBy("at").limit(200).onSnapshot(s=>{R.log=s.docs.map(x=>x.data());if(S.view==="game"&&S.mode==="room")render()},()=>{})}
    if(S.view==="game")render();
  },()=>{R.err="방 정보를 불러오지 못했어.";render()}));
  R.unsubs.push(db.collection(`rooms/${code}/chat`).orderBy("at","desc").limit(120).onSnapshot(s=>onChat("room",s),()=>{}));
  if(room)room.join("r-"+code.toLowerCase()).then(n=>{
    if(S.roomCode!==code){n.leave().catch(()=>{});return}
    R.named=n;n.presence({asking:false}).catch(()=>{});
    R.unsubs.push(n.onPeers(ch=>{R.peers=ch.peers;ensureNames(ch.peers.map(p=>p.by));if(isWaiting()&&S.view==="game")render();else renderRoomBar()},()=>{}));
  }).catch(()=>{});
  render();window.scrollTo({top:0});
}
function leaveRoom(){
  const oldCode=R.code;
  const live=NET!=="p2p"||(oldCode&&(P2P.hosts[oldCode]||P2P.clients[oldCode]));
  if(oldCode&&db&&me.id&&live){const ref=db.doc("rooms/"+oldCode);ref.get().then(s=>{const m={...(s.data()?.members||{})};if(me.id in m){delete m[me.id];return ref.update({members:m})}}).catch(()=>{}).finally(()=>{if(NET==="p2p")p2pClose(oldCode)})}
  else if(NET==="p2p"&&oldCode)p2pClose(oldCode);
  showInvite=false;
  R.unsubs.forEach(u=>{try{u()}catch(e){}});R.logUnsub?.();R.named?.leave().catch(()=>{});
  Object.assign(R,{code:null,doc:null,round:null,log:[],peers:[],unsubs:[],logUnsub:null,named:null,picking:false,err:""});
  if(S.mode==="room"){S.mode="solo";S.roomCode=null}
  C.room=[];C.ids.room=[];C.tab="note";
}
async function changeRoomCase(k){
  if(!db||!S.roomCode||CASES[k]?.soon)return;
  if(hostId()!==me.id){statusMsg="사건은 방장만 바꿀 수 있어.";statusErr=true;render();return}
  try{await db.doc("rooms/"+S.roomCode).update({caseIdx:k,round:rid(),at:Date.now()})}
  catch(e){statusMsg=denied(e)?"사건을 바꿀 권한이 없어.":"사건을 바꾸지 못했어.";statusErr=true;render()}
}

/* ================= 이름 ================= */
const NAME_TRY={};
function ensureNames(ids){if(!user)return;const now=Date.now();
  /* 이름을 아직 못 찾은 사람은 4초 뒤 다시 찾아본다 (친구 이름이 늦게 도착할 수 있음) */
  const miss=[...new Set(ids.filter(i=>i&&!NAMES[i]?.name&&!(NAME_TRY[i]>now-4000)))];if(!miss.length)return;
  miss.forEach(i=>{NAME_TRY[i]=now;if(!(i in NAMES))NAMES[i]=null});
  user.profiles(miss).then(ps=>{let changed=false;for(const id in ps){if(ps[id]?.name||!NAMES[id]){if((NAMES[id]?.name||"")!==(ps[id]?.name||""))changed=true;NAMES[id]=ps[id]}}
    if(!changed)return;if(S.view==="game"||S.view==="rooms")render();else renderChat();renderRoomBar()})}

/* ================= 채팅 ================= */
const chatEl=document.getElementById('chat'),chatList=document.getElementById('chatList'),chatNote=document.getElementById('chatNote'),chatInp=document.getElementById('chatInp');
function onChat(ch,s){
  const first=!C.loaded[ch];C.loaded[ch]=true;
  C.ids[ch]=s.docs.map(d=>d.id);C[ch]=s.docs.map(d=>d.data()).reverse();
  if(!first){const n=s.docChanges().filter(x=>x.type==="added"&&x.doc.data()?.by!==me.id&&(x.doc.data()?.at||0)>C.seen[ch]).length;
    if(n&&!((C.open||docked())&&C.tab===ch))C.unread+=n}
  ensureNames(C[ch].map(m=>m.by));renderChat();
}
let chatLastLen=-1,chatLastTab="";
/* 사건 노트: 사건마다 따로, 이 브라우저에만 저장되는 나만 보는 메모 */
function noteCaseIdx(){if(Number.isInteger(C.noteSel)&&CASES[C.noteSel])return C.noteSel;if(S.view==="game"){const g=curGame();if(!g.loading)return g.idx}return CASES[S.cur]&&!CASES[S.cur].soon?S.cur:0}
function renderChat(){
  const inRoom=S.mode==="room"&&!!S.roomCode;
  if(!inRoom&&C.tab==="room")C.tab="note";
  document.getElementById('ct-note').setAttribute('aria-pressed',C.tab==="note");
  const rt=document.getElementById('ct-room');rt.setAttribute('aria-pressed',C.tab==="room");rt.disabled=!inRoom;rt.textContent=inRoom?`방 채팅 · ${S.roomCode}`:"방 채팅";
  rt.title=inRoom?"":"친구 방에 들어가면 쓸 수 있어";
  const ub=document.getElementById('unread');ub.hidden=!C.unread;ub.textContent=C.unread>99?"99+":C.unread;
  document.getElementById('fabLabel').textContent=inRoom?"노트 · 채팅":"사건 노트";
  const dk=docked();
  document.getElementById('chatFab').hidden=!S.lit||C.open||dk;
  chatEl.hidden=!(C.open||dk);
  if(!C.open&&!dk)return;
  const nearBottom=chatList.scrollHeight-chatList.scrollTop-chatList.clientHeight<80;
  let len;
  if(C.tab==="note"){
    const k=noteCaseIdx(),c=CASES[k],list=NOTES[c.id]||[];len=list.length;
    const opts=CASES.map((x,i)=>x.soon?'':`<option value="${i}" ${i===k?'selected':''}>${esc(labelOf(i))} · ${esc(x.title)}${NOTES[x.id]?.length?` (${NOTES[x.id].length})`:''}</option>`).join('');
    chatList.innerHTML=`<div class="note-h"><select id="note-sel" aria-label="노트를 볼 사건">${opts}</select><small>나만 볼 수 있어. 이 기기에만 저장돼.</small></div>`+
      (list.length?list.map((n,i)=>`<div class="note"><p>${esc(n.t)}</p><div class="note-f"><time>${esc(hhmm(n.at))}</time><button class="note-x" data-del="${i}" aria-label="메모 지우기">지우기</button></div></div>`).join('')
      :`<p class="chat-empty">떠오른 추리나 단서를 적어둬.<br>사건마다 따로 저장돼.</p>`);
    document.getElementById('note-sel').onchange=e=>{C.noteSel=+e.target.value;chatLastLen=-1;renderChat()};
    chatList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.del,1);if(!list.length)delete NOTES[c.id];saveNotes();renderChat()});
    chatInp.placeholder="메모 남기기";document.getElementById('chatSend').textContent="적기";
    chatNote.textContent="";chatInp.disabled=false;document.getElementById('chatSend').disabled=false;
  }else{
    const msgs=C.room||[];len=msgs.length;
    chatList.innerHTML=msgs.length?msgs.map(m=>{const p=NAMES[m.by];const mine=m.by&&m.by===me.id;
      return `<div class="msg ${mine?'mine':''}">${p?.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`:`<span class="ph">${esc((p?.name||'').slice(0,1))}</span>`}<div><div class="mh"><b>${esc(who(m.by))}</b><time>${esc(hhmm(m.at))}</time></div><p>${esc(m.text)}</p></div></div>`}).join('')
      :`<p class="chat-empty">이 방엔 아직 대화가 없어. 먼저 말을 걸어봐.</p>`;
    const canSend=!!db&&!!me.id&&!C.readonly;
    chatInp.placeholder="메시지 보내기";document.getElementById('chatSend').textContent="보내기";
    chatNote.textContent=!me.id?"로그인 정보가 없어서 읽기만 할 수 있어.":C.readonly?"메시지를 보낼 권한이 없어.":"";
    chatInp.disabled=!canSend;document.getElementById('chatSend').disabled=!canSend;
  }
  if(nearBottom||chatLastTab!==C.tab||chatLastLen<0)chatList.scrollTop=chatList.scrollHeight;
  chatLastLen=len;chatLastTab=C.tab;
}
function hhmm(t){if(!t)return"";const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
function openChat(){C.open=true;if(C.tab==="room"){C.unread=0;C.seen.room=Date.now()}chatLastLen=-1;renderChat();setTimeout(()=>{if(!chatInp.disabled)chatInp.focus()},30)}
document.getElementById('chatFab').onclick=openChat;
document.getElementById('chatClose').onclick=()=>{C.open=false;C.seen.room=Date.now();renderChat()};
document.querySelectorAll('.ctabs button').forEach(b=>b.onclick=()=>{if(b.disabled)return;C.tab=b.dataset.ch;if(C.tab==="room"){C.unread=0;C.seen.room=Date.now()}renderChat()});
document.getElementById('chatForm').onsubmit=async e=>{
  e.preventDefault();const text=chatInp.value.trim();if(!text)return;
  if(C.tab==="note"){const c=CASES[noteCaseIdx()];(NOTES[c.id]=NOTES[c.id]||[]).push({t:text.slice(0,300),at:Date.now()});saveNotes();chatInp.value="";chatLastLen=-1;renderChat();return}
  if(!db||!me.id||!S.roomCode)return;
  const path=`rooms/${S.roomCode}/chat`;
  chatInp.value="";
  try{await db.collection(path).add({text:text.slice(0,300),by:me.id,at:Date.now()});
    const ids=C.ids.room;if(ids.length>=120){for(const id of ids.slice(100)){try{await db.doc(path+"/"+id).delete()}catch(e){}}}}
  catch(err){if(denied(err))C.readonly=true;else chatNote.textContent="메시지를 보내지 못했어. 다시 시도해줘.";chatInp.value=text;renderChat()}
};
document.addEventListener('keydown',e=>{if(e.key==="Escape"){if(showInvite){showInvite=false;renderInvite();return}const z=document.getElementById('zoom');if(!z.hidden){z.hidden=true;return}if(C.open){C.open=false;renderChat()}}});

/* ================= 시작 ================= */
function start(saved){
  if(saved&&typeof saved==="object"&&saved.view){
    ["view","lit","genre","cur","hintSeen"].forEach(k=>{if(k in saved)S[k]=saved[k]});
    if(S.view==="intro")S.lit=false;
    if(saved.solo)S.solo=saved.solo;
    if(!(S.cur>=0&&S.cur<CASES.length))S.cur=0;if(S.last?.t==="solo"&&!(S.last.i<CASES.length))setLast(null);
    if(saved.mode==="room"&&saved.roomCode){S.view="rooms";S.pendingRoom=saved.roomCode}
    if(S.view==="game"&&CASES[S.cur]?.soon)S.view="pick";
    if(S.view==="intro")S.lit=false;
  }
  try{const q=new URLSearchParams(location.search).get("room");if(q&&validCode(q.toUpperCase())){S.pendingRoom=q.toUpperCase();S.view="rooms";S.lit=true;history.replaceState(null,"",location.pathname)}}catch(e){}
  if(LS.get("soup.case2",null)!=="C-0904"){delete S.solo[1];saveSolo();if(S.last?.t==="solo"&&S.last.i===1)setLast(null);LS.set("soup.case2","C-0904")}
  applySettings();render();
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  use("sample").then(fn=>{
    if(fn){sample=fn;sampleState="ok"}
    else if(API_URL){sample=workerSample;backend="worker";sampleState="ok"}
    else sampleState="none";
    render()});
  use("room").then(r=>{if(r)room=r});
  Promise.all([use("user"),use("db")]).then(async([u,d])=>{
    user=u;db=d;if(u){try{me=await u.me()}catch(e){}}
    if(!db){try{if(FIREBASE_CONFIG)await initFirebase();else await initP2P()}catch(e){console.warn("net",e);db=null;fbMode=false}}
    dbState=db?"ok":"none";
    if(S.pendingRoom){const c=S.pendingRoom;delete S.pendingRoom;if(db){pendingJoin=c;if(fbMode&&!user?.name?.()){roomMsg=`이름을 정하고 ${c} 방에서 맡을 역할을 골라줘.`;render()}else lookupJoin(c)}else{roomMsg="같이 수사하기는 아직 준비 중이야.";render()}}else render();
  });
}
window.claude?.hot?.snapshot?.(()=>({view:S.view==="game"&&S.mode==="room"?"rooms":S.view,lit:S.lit,genre:S.genre,cur:S.cur,mode:S.mode,roomCode:S.roomCode,solo:S.solo,hintSeen:S.hintSeen}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
