<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수프를 끓이는 동안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 가스불 하나 켜진 어두운 부엌(메인) → 단일 컬럼 사건 파일(게임) + 오른쪽 채팅 서랍. 의도적으로 어두운 단일 테마 */
:root{
  color-scheme:dark;
  --paper:#0a0c11; --glow:#18202e; --card:#12161e; --ink:#e3e5ea; --muted:#8a90a0; --line:#252b37;
  --hl:#c9a94a; --hl-ink:#0a0c11; --no:#e2604f; --yes:#55c096; --meh:#9a9db2; --chip:#1a1f29;
  --bulb:#ffe2a0; --warm:rgba(255,200,110,.16);
  --title:"Song Myung","Nanum Myeongjo",serif;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  background:radial-gradient(120% 70% at 50% -10%,var(--glow),transparent 60%),radial-gradient(140% 100% at 50% 50%,transparent 55%,#000 100%),var(--paper);
  background-attachment:fixed}
body.big{font-size:17px}
body.horror{--paper:#080506;--glow:#3a0c12;--card:#140d0f;--line:#2f1c20;--muted:#9c8a8e;--chip:#1e1215;--hl:#c4242f;--hl-ink:#ffffff}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

/* ---------- 메인: 어두운 부엌과 가스레인지 ---------- */
.stage{position:relative;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden;
  padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#000;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.pool{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease-out;
  background:radial-gradient(55% 42% at 50% 64%,rgba(255,150,70,.20),rgba(70,110,255,.05) 55%,transparent 78%)}
.stage.lit .pool{opacity:1}
.stage-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.stove{position:relative;width:min(300px,72vw)}
.stove svg{display:block;width:100%;height:auto;overflow:visible}
.heat,.soup-hot{opacity:0;transition:opacity 2.4s .3s ease-out}
.stage.lit .heat,.stage.lit .soup-hot{opacity:1}
.flames{opacity:0}
.stage.lit .flames{opacity:1}
.flame{transform-box:fill-box;transform-origin:50% 100%}
.stage.lit .flame{animation:flick .2s infinite alternate ease-in-out}
.stage.lit .flame:nth-child(2n){animation-duration:.26s}.stage.lit .flame:nth-child(3n){animation-duration:.31s}
@keyframes flick{from{transform:scaleY(.82) scaleX(.95)}to{transform:scaleY(1.1) scaleX(1.03)}}
.stage.lighting .flames{animation:ignite 1s steps(1,end)}
body.noflick .stage.lighting .flames{animation:fadeon .6s ease-out}
@keyframes ignite{0%{opacity:0}14%{opacity:1}22%{opacity:0}34%{opacity:1}100%{opacity:1}}
@keyframes fadeon{from{opacity:0}to{opacity:1}}
.bubble{opacity:0;transform-box:fill-box;transform-origin:center}
.stage.lit .bubble{animation:boil 1.7s infinite ease-in}
@keyframes boil{0%{opacity:0;transform:scale(.2)}55%{opacity:.95;transform:scale(1)}80%{opacity:.9;transform:scale(1.15)}100%{opacity:0;transform:scale(1.35)}}
.steam{position:absolute;left:0;right:0;top:-40%;height:75%;pointer-events:none}
.steam i{position:absolute;bottom:0;width:26%;height:55%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,222,.30),transparent);filter:blur(10px);opacity:0}
.steam i:nth-child(1){left:18%}.steam i:nth-child(2){left:38%}.steam i:nth-child(3){left:56%}.steam i:nth-child(4){left:30%}
.stage.lit .steam i{animation:steam 4.2s infinite ease-out}
.stage.lit .steam i:nth-child(1){animation-delay:1.6s}.stage.lit .steam i:nth-child(2){animation-delay:2.6s}
.stage.lit .steam i:nth-child(3){animation-delay:3.4s}.stage.lit .steam i:nth-child(4){animation-delay:4.3s}
@keyframes steam{0%{opacity:0;transform:translateY(20%) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(12%,-120%) scale(1.6)}}
.knob{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px}
.dial{position:relative;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#50535b,#1c1e23 70%);border:1px solid #3a3d45;
  box-shadow:0 6px 20px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.08);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.dial::before{content:"";position:absolute;left:50%;top:8px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:#8a8e97}
.knob.turn .dial{transform:rotate(-90deg)}
.sw-label{font-size:13px;letter-spacing:2px;color:#6d717c}
.knob:hover .sw-label{color:#a3a7b2}
.knob:hover .dial{border-color:#5a5e68}
.stage:not(.lit) .title{visibility:hidden}
.title{font-family:var(--title);font-weight:400;font-size:clamp(34px,8.5vw,64px);line-height:1.15;margin:0;color:#f3e6c8;letter-spacing:1px;text-wrap:balance;
  text-shadow:0 0 24px rgba(255,200,120,.25)}
.stage.lighting .title{animation:rise 1.1s 1.1s both ease-out}
.menu{display:flex;flex-direction:column;gap:4px;align-items:center}
.menu button{background:none;border:0;cursor:pointer;font-family:var(--display);font-size:24px;color:#cfc7b4;padding:6px 18px;position:relative;letter-spacing:1px}
.menu button::before{content:"";position:absolute;left:50%;bottom:6px;width:0;height:1px;background:var(--bulb);transition:width .25s,left .25s}
.menu button:hover:not(:disabled)::before,.menu button:focus-visible::before{width:70%;left:15%}
.menu button:hover:not(:disabled){color:#fff3d6}
.menu button:disabled{color:#4d4f57;cursor:default}
.menu small{display:block;font-family:var(--body);font-size:12px;color:#6d717c;letter-spacing:0}
.stage.lighting .menu button{animation:rise .6s both ease-out}
.stage.lighting .menu button:nth-child(1){animation-delay:1.2s}.stage.lighting .menu button:nth-child(2){animation-delay:1.3s}
.stage.lighting .menu button:nth-child(3){animation-delay:1.4s}.stage.lighting .menu button:nth-child(4){animation-delay:1.5s}
.small-link{background:none;border:0;cursor:pointer;font-size:13px;color:#7b7f8a;text-decoration:underline;text-underline-offset:3px}
.stage.lighting .small-link{animation:rise .6s 1.7s both ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 공통 화면 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{background:none;border:0;cursor:pointer;font-family:var(--title);font-size:19px;color:#f3e6c8;padding:0}
.top-r{display:flex;gap:8px;align-items:center}
.wrap{max-width:760px;margin:0 auto;padding-block:22px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.h2{font-family:var(--title);font-weight:400;font-size:30px;line-height:1.2;margin:0;color:#f3e6c8;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.btn{font-weight:700;color:var(--paper);background:var(--ink);border:0;border-radius:6px;padding:11px 18px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:13.5px;padding:8px 14px}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
.btn.hl{background:var(--hl);color:var(--hl-ink)}
.notice{background:var(--chip);border-radius:6px;padding:12px 14px;font-size:13.5px;margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:13px;letter-spacing:1.5px;color:var(--muted);font-weight:700}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-weight:700;color:var(--hl-ink);background:var(--hl);padding:1px 8px;border-radius:3px;letter-spacing:.5px;font-size:12px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.genres{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.genre{background:transparent;border:0;padding:10px;cursor:pointer;font-family:var(--display);font-size:22px}
.genre + .genre{border-left:1.5px solid var(--ink)}
.genre[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.casecard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.casecard:hover{border-color:var(--hl);transform:translateY(-1px)}
.casecard .no{font-family:var(--mono);font-size:12px;color:var(--hl);font-weight:600}
.casecard .ct{font-family:var(--display);font-size:19px;line-height:1.3}
.casecard .cs{font-size:12.5px;color:var(--muted)}
.casecard.soon{opacity:.45;cursor:default}.casecard.soon:hover{border-color:var(--line);transform:none}
.soon-tag{font-family:var(--body);font-size:12px;opacity:.7;vertical-align:middle}
.casecard .cs.ok{color:var(--yes)}.casecard .cs.bad{color:var(--no)}

/* ---------- 게임 ---------- */
.roombar{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--chip)}
.rb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.rb-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.code{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:3px;color:var(--hl)}
.faces{display:flex}
.faces img,.faces .ph{width:26px;height:26px;border-radius:50%;border:2px solid var(--chip);margin-left:-6px;background:#333;object-fit:cover}
.faces :first-child{margin-left:0}
.asking{font-size:12.5px;color:var(--muted)}
.picker{display:flex;gap:8px;flex-wrap:wrap}
select,.field{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0}
select{max-width:100%}

.case{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px}
.case h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.25;margin:0;text-wrap:balance}
.story{margin:0;font-size:1.07em;max-width:62ch}
.mission{margin:0;font-size:13.5px;color:var(--muted)}
.mission b{color:var(--ink)}

.meterbox{display:flex;flex-direction:column;gap:8px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line);margin:4px 0 20px}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--hl);transition:width .3s}
.meter.danger .fill{background:var(--no)}
.tick{position:absolute;top:-4px;width:2px;height:16px;background:var(--muted);transform:translateX(-1px)}
.tick.on{background:var(--hl)}
.tick i{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.tick.end{background:var(--no)}.tick.end i{left:auto;right:0;transform:none;color:var(--no)}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:620px){.hints{grid-template-columns:1fr}}
.hint{border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.hint .n{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:1px}
.hint.on{border-style:solid;border-color:var(--hl);color:var(--ink);background:var(--card)}
.hint.on .n{color:var(--hl)}
.hints.media{grid-template-columns:1fr}
.sms{display:flex;flex-direction:column;gap:8px;background:#0b0d12;border-radius:12px;padding:14px;max-width:420px}
.bub{display:flex;flex-direction:column;gap:2px;max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5}
.bub b{font-size:11.5px;font-weight:700;opacity:.75}
.bub.in{align-self:flex-start;background:#22262f;color:#e6e8ec;border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:#3b4a63;color:#eef2f8;border-bottom-right-radius:4px}
.shot{display:block;padding:0;border:0;background:none;cursor:zoom-in;border-radius:6px;overflow:hidden;max-width:560px}
.shot img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.zoom img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:4px}
.hint.new{animation:hintin .8s ease-out}
@keyframes hintin{0%{transform:scale(.94);box-shadow:0 0 0 0 var(--hl)}50%{box-shadow:0 0 0 6px transparent}100%{transform:none}}

.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.keys{grid-template-columns:1fr}}
.key{border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start;min-width:0}
.key .n{font-family:var(--mono);font-size:12px;font-weight:600;flex:none;padding-top:1px}
.key.on{border-style:solid;border-color:var(--yes);color:var(--ink);background:var(--card)}
.key.on .n{color:var(--yes)}

.ask{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:6px}
.mode button{font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:4px 10px;cursor:pointer}
.mode button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.row{display:flex;gap:8px}
.row .field{flex:1;font-size:16px;padding:12px 14px}
.field:focus,select:focus{outline:none;border-color:var(--ink)}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--no)}

.log{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.entry{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.entry .qn{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;width:30px;padding-top:2px;font-variant-numeric:tabular-nums}
.entry .q{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.entry .q span{word-break:break-word}
.entry .q small{color:var(--muted);font-size:12.5px}
.stamp{flex:none;font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.5px;padding:2px 7px;border:2px solid currentColor;border-radius:4px;transform:rotate(-6deg);white-space:nowrap}
.stamp.yes{color:var(--yes)}.stamp.no{color:var(--no)}.stamp.meh{color:var(--meh)}
.stamp.guess{color:var(--hl-ink);background:var(--hl);border-color:var(--hl)}
.entry.fresh .stamp{animation:thunk .25s ease-out}
@keyframes thunk{from{transform:rotate(-6deg) scale(1.7);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.empty{color:var(--muted);font-size:14px;padding:14px 2px;margin:0}

.reveal{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.reveal.over{border-color:var(--no)}
.reveal .big{font-family:var(--display);font-size:26px;line-height:1.2}
.reveal .big.win{color:var(--yes)}.reveal .big.lose{color:var(--no)}
.reveal p{margin:0;max-width:62ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.dnote{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:12px}
.dnote p{font-size:14px;color:var(--muted)}
.dnote b{color:var(--ink)}

/* ---------- 방 / 설정 / 자료실 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.panel p{margin:0;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.codein{font-family:var(--mono);text-transform:uppercase;letter-spacing:4px;font-size:18px}
.rooms{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.roomrow:hover .code{text-decoration:underline}
.roomrow span{font-size:13.5px;color:var(--muted)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.setrow small{color:var(--muted);font-size:13px}
.tog{flex:none;width:50px;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--chip);position:relative;cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.tog[aria-pressed="true"]{background:var(--hl);border-color:var(--hl)}
.tog[aria-pressed="true"]::after{left:25px;background:var(--hl-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
.tbl th{text-align:left;font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--hl);font-weight:700;white-space:nowrap}
.dbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dbig b{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--hl);font-variant-numeric:tabular-nums;line-height:1.1}
.dbig span{font-size:13px;color:var(--muted)}

{g:"crime",id:"C-0904",title:"다시 나타난 모델",

두 사람의 첫 만남:
서린은 모델 일이 잘 풀리지 않던 어느 날, 집에 돌아가지 않고 클럽으로 향했다. 그곳에서 일하던 유진은 자신과 놀랄 만큼 닮은 서린을 보고 말을 걸었다. 두 사람은 서로의 고민과 일상을 나누며 친구가 됐다. 둘은 서로의 사진을 찍어주고, 닮은 얼굴을 보며 웃었다.

여행:
서린이 실종되기 한 달 전, 두 사람은 비수기의 한산한 바닷가로 여행을 떠났다. 서린은 카메라 앞에 서는 대신 유진의 모습을 담았다. 유진은 장난처럼 "우리 둘 중 한 명이 사라져도 사람들은 한동안 구분 못 할 것 같아."라고 말했다. 돌아오는 길에는 유진이 운전했다.

사고:
비가 내리는 산길에서 유진이 운전하던 차가 미끄러져 가파른 비탈 아래로 떨어졌다. 유진은 현장에서 숨졌다. 서린은 몇 분 뒤 정신을 차렸다. 차는 도로에서 보이지 않는 곳에 걸려 있었고 목격자는 없었다. 서린은 유진을 깨우려 했지만 유진은 반응하지 않았다. 충격과 부상으로 혼란스러웠던 서린은 한동안 유진 곁을 떠나지 못하다가, 구조를 요청하지 않고 사고 현장을 떠났다.

4년 뒤 큰비로 산비탈이 무너지면서 사고 차량의 일부가 발견됐다. 수색과 재조사가 시작됐고, 유류품과 시신으로 유진의 사망이 확인됐다. 관련 뉴스를 본 서린은 스스로 경찰서를 찾아가 자신이 한서린이라고 밝히고, 사고 뒤 구조를 요청하지 않고 떠난 일과 유진의 신분으로 살아온 일을 털어놓았다.

서린은 유진을 죽인 혐의로 재판을 받는 것이 아니다. 유진의 죽음은 교통사고였다. 서린은 사고 뒤 신고하지 않고 현장을 떠난 일, 그리고 유진의 신분을 사용해 살아온 일로 재판을 받는다.

[핵심 정답]
- 돌아온 사람은 유진이 아니라 한서린 본인이다.
- 유진은 사고 당시 운전하다 사망했다.
- 서린은 사고에서 살아남았지만 구조를 요청하지 않고 현장을 떠났다.
- 서린은 죄책감, 상실감, 자신의 삶에서 벗어나고 싶은 마음으로 유진의 신분을 사용했다.
- 서린은 유진을 죽이려고 사고를 일으킨 것이 아니다.
- 재판 이유는 살인이 아니라 사고 후 신고하지 않은 일과 유진의 신분을 사용한 일이다.

[질문별 기준 답변]
- 유진은 사고로 죽었나요? → 예.
- 유진이 운전하고 있었나요? → 예.
- 서린이 사고를 일부러 냈나요? → 아니오.
- 서린은 사고에서 살아남았나요? → 예.
- 서린은 사고 직후 경찰에 신고했나요? → 아니오.
- 돌아온 여자는 실제 유진인가요? → 아니오.
- 돌아온 여자는 한서린인가요? → 예.
- 서린은 유진의 신분으로 살았나요? → 예.
- 서린은 유진을 살해했나요? → 아니오.
- 두 사람이 연인이었나요? → 그럴 수도 있다. 관계는 확정하지 않는다.
- 두 사람은 친구였나요? → 예.
- 두 사람은 닮았나요? → 예.
- 두 사람은 실제 쌍둥이(가족)인가요? → 아니오.
- 사고 현장에 목격자가 있었나요? → 아니오.
- 서린이 스스로 경찰서에 찾아왔나요? → 예.
- 사고 차량이 발견된 것이 서린이 돌아온 계기인가요? → 예.
- 재판은 유진을 살해한 혐의로 열리나요? → 아니오.
- 사건과 관계없는 질문 → 상관없음.

function derive(idx,log){
  const c=CASES[idx],found=new Set();let q=0,solved=false,gaveUp=false;
  for(const e of log){(e.found||[]).forEach(n=>{n=Number(n);if(n>=0&&n<c.keys.length)found.add(n)});

  if(found.size===c.keys.length)solved=true;
  const gameOver=!solved&&!gaveUp&&q>=MAXQ;
  return {found,q,solved,gaveUp,gameOver,over:solved||gaveUp||gameOver,hints:Math.min(3,Math.floor(q/HINT_EVERY))};
}

function stampFor(a){
  if(a==="예"||a==="YES")return`<span class="stamp yes">예</span>`;if(a==="아니오"||a==="NO")return`<span class="stamp no">아니오</span>`;
  if(a==="그럴 수도 있다")return`<span class="stamp guess">그럴 수도</span>`;
  if(a==="정답")return`<span class="stamp yes">정답</span>`;if(a==="거의 맞음")return`<span class="stamp guess">거의</span>`;
  if(a==="아직")return`<span class="stamp no">아직</span>`;return`<span class="stamp meh">${esc(a)}</span>`;
}

function renderGame(){
  const g=curGame();
  const right=g.room?`<button class="btn ghost" data-go="menu">메인</button>`:`<button class="btn ghost" data-go="start">사건 목록</button>`;
  if(g.loading){app.innerHTML=topBar(right)+`<main class="wrap"><div id="roombar" class="roombar"></div><p class="empty">${esc(R.err||"방 정보를 불러오는 중…")}</p></main>`;renderRoomBar();return}
  const c=CASES[g.idx],d=derive(g.idx,g.log),G=GENRE[c.g];
  document.body.classList.toggle('horror',c.g==="horror");
  let seen=S.hintSeen[g.key];if(seen===undefined){seen=d.hints;S.hintSeen[g.key]=seen}
  const newHint=d.hints>seen&&!d.over;
  if(d.hints>seen){S.hintSeen[g.key]=d.hints;if(newHint)sChime()}
  const left=MAXQ-d.q,nextHint=d.hints<3?(d.hints+1)*HINT_EVERY-d.q:null;
  let qn=0;
  const logHtml=g.log.map(e=>{const isQ=e.kind==="q";if(isQ&&e.answer!=="다시")qn++;if(e.kind==="giveup")return '';
    const fresh=(e.at||0)>=freshAt;
    return `<div class="entry ${fresh?'fresh':''}"><span class="qn">${isQ?(e.answer==="다시"?'–':'Q'+qn):'추리'}</span>
      <div class="q"><span>${esc(e.text)}</span>${g.room?`<small>${esc(NAMES[e.by]?.name||'누군가')}</small>`:''}${e.note?`<small>${esc(e.note)}</small>`:''}</div>${stampFor(e.answer)}</div>`}).reverse().join('');
  let h=topBar(right)+`<main class="wrap">
  ${g.room?`<div id="roombar" class="roombar"></div>`:''}
  <article class="case">
    <div class="meta"><span class="tag">${c.g==="crime"?"CASE":"제보"}</span><span>${labelOf(g.idx)} · ${G.meta(c)}</span></div>
    <h2>${esc(c.title)}</h2>
    <p class="story">${esc(c.story)}</p>
    <p class="mission">${c.mission||G.mission}</p>
  </article>
  <section class="meterbox">
    <div class="sec-h"><h3>질문</h3><span class="count">${d.q} / ${MAXQ}${d.over?'':nextHint?` · 다음 힌트까지 ${nextHint}개`:` · 남은 질문 ${left}개`}</span></div>
    <div class="meter ${left<=5&&!d.solved?'danger':''}" role="img" aria-label="질문 ${d.q}개 사용, 최대 ${MAXQ}개">
      <div class="fill" style="width:${Math.min(100,d.q/MAXQ*100)}%"></div>
      ${[1,2,3].map(n=>n*HINT_EVERY).map(t=>`<span class="tick ${d.q>=t?'on':''}" style="left:${t/MAXQ*100}%"><i>힌트</i></span>`).join('')}
      <span class="tick end" style="left:100%"><i>끝</i></span>
    </div>
    <div class="hints ${c.hints.some(h=>typeof h==="object")?"media":""}">${[0,1,2].map(i=>{const on=i<d.hints||d.over;
      return `<div class="hint ${on?'on':''} ${on&&newHint&&i===d.hints-1?'new':''}"><span class="n">힌트 ${i+1}${on&&typeof c.hints[i]==="object"?` · ${esc(c.hints[i].label)}`:''}</span>${on?hintBody(c.hints[i]):`<span>질문 ${(i+1)*HINT_EVERY}개째에 열려</span>`}</div>`}).join('')}</div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="sec-h"><h3>핵심 단서</h3><span class="count">${d.found.size} / ${c.keys.length} 발견</span></div>
    <div class="keys">${c.keys.map((k,i)=>{const on=d.found.has(i)||d.over;
      return `<div class="key ${on?'on':''}"><span class="n">${on?'✔':'#'+(i+1)}</span><span>${on?esc(k):'아직 밝혀지지 않은 단서'}</span></div>`}).join('')}</div>
  </section>`;
  if(d.over){
    const nx=nextInGenre(g.idx);
    h+=`<section class="reveal ${d.gameOver?'over':''}">
      <div class="big ${d.solved?'win':d.gameOver?'lose':''}">${d.solved?`풀었어! 질문 ${d.q}개 만에`:d.gameOver?`게임 오버 · 질문 ${MAXQ}개를 다 썼어`:'진실은 이거였어'}</div>
      ${c.truth.split("\n\n").map(t=>`<p>${esc(t)}</p>`).join("")}
      <div class="actions">${g.room
        ?`<button class="btn" id="r-change">다른 사건 고르기</button><button class="btn ghost" id="r-again">같은 사건 다시</button>`
        :`${nx>=0?`<button class="btn" id="next">다음 ${G.label}</button>`:''}<button class="btn ghost" id="reset">다시 풀기</button><button class="btn ghost" data-go="start">사건 목록</button>`}</div>
    </section>`;
  } else {
    const dis=sampleState!=="ok"||busy;
    h+=`<section class="ask">
      <div class="mode" role="group" aria-label="입력 종류"><button id="m-q" aria-pressed="${mode==='q'}">질문하기</button><button id="m-g" aria-pressed="${mode==='g'}">정답 말하기</button></div>
      ${sampleState==="none"?`<p class="notice">이 화면에선 AI 진행자를 부를 수 없어. claude.ai나 Claude 앱에서 열면 질문할 수 있어.</p>`:''}
      <form class="row" id="f"><input class="field" id="inp" autocomplete="off" maxlength="200" placeholder="${mode==='q'?(c.ph||G.ph):'무슨 일이었는지 한두 문장으로 써봐'}" ${dis?'disabled':''}>
        <button class="btn" ${dis?'disabled':''}>${busy?'생각 중…':mode==='q'?'묻기':'제출'}</button></form>
      <p class="status ${statusErr?'err':''}" id="status">${esc(sampleState==="pending"?'AI 진행자 연결 중…':busy?'진행자가 생각하는 중…':statusMsg)}</p>
    </section>`;
  }
  h+=`<section style="display:flex;flex-direction:column;gap:8px">
    <div class="sec-h"><h3>문답 기록</h3>${d.over?'':'<button class="btn ghost" id="giveup">포기하고 진실 보기</button>'}</div>
    <div class="log">${logHtml||'<p class="empty">아직 질문이 없어. 예나 아니오로 답할 수 있게 물어봐.</p>'}</div>
  </section></main>`;
  app.innerHTML=h;
  if(g.room){ensureNames(g.log.map(e=>e.by));renderRoomBar()}
  const f=document.getElementById('f');
  if(f){f.onsubmit=e=>{e.preventDefault();submit()};
    document.getElementById('m-q').onclick=()=>{mode='q';render();focusInp()};
    document.getElementById('m-g').onclick=()=>{mode='g';render();focusInp()}}
  on('giveup',()=>{if(busy)ctl?.abort();addEntry({kind:"giveup",text:"",answer:""})});
  on('next',()=>{startSolo(nextInGenre(g.idx));window.scrollTo({top:0})});
  on('reset',()=>{S.solo[S.cur]=[];S.hintSeen[g.key]=0;saveSolo();render()});
  on('r-again',()=>changeRoomCase(g.idx));
  on('r-change',()=>{R.picking=true;renderRoomBar();document.getElementById('roombar')?.scrollIntoView({block:"start"})});
}
function hintBody(h){
  if(typeof h==="string")return `<span>${esc(h)}</span>`;
  if(h.sms)return `<div class="sms" role="group" aria-label="${esc(h.label)}">${h.sms.map(([who,msg])=>`<div class="bub ${who===h.me?'out':'in'}"><b>${esc(who)}</b><span>${esc(msg)}</span></div>`).join('')}</div>`;
  if(h.img)return `<button class="shot" data-zoom="${esc(h.img)}" data-alt="${esc(h.alt||'')}" aria-label="사진 크게 보기"><img src="${esc(h.img)}" alt="${esc(h.alt||'')}" loading="lazy"></button>`;
  return '';
}
const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
function nextInGenre(k){for(let i=k+1;i<CASES.length;i++)if(CASES[i].g===CASES[k].g&&!CASES[i].soon)return i;return -1}
function focusInp(){const i=document.getElementById('inp');if(i&&!i.disabled)i.focus()}

function caseOptions(sel){return ["crime","horror"].filter(g=>CASES.some(c=>c.g===g)).map(g=>`<optgroup label="${GENRE[g].label}">${CASES.map((c,k)=>c.g!==g?'':`<option value="${k}" ${k===sel?'selected':''}>${labelOf(k)} · ${esc(c.title)}</option>`).join('')}</optgroup>`).join('')}

function renderRoomBar(){
  const el=document.getElementById('roombar');if(!el)return;
  const byId=new Map();R.peers.forEach(p=>{const k=p.by||p.peer;if(!byId.has(k))byId.set(k,p)});
  const peers=[...byId.values()];
  const asking=peers.filter(p=>p.presence?.asking&&!p.isMe).map(p=>NAMES[p.by]?.name||'누군가');
  el.innerHTML=`<div class="rb-row"><div class="rb-l"><span class="code">${esc(S.roomCode)}</span>
      <button class="btn ghost" id="rb-copy">코드 복사</button>
      ${room?`<span class="faces">${peers.slice(0,6).map(p=>NAMES[p.by]?.avatarUrl?`<img src="${esc(NAMES[p.by].avatarUrl)}" alt="">`:`<span class="ph"></span>`).join('')}</span><span class="asking">접속 ${peers.length}명</span>`:''}
    </div><div class="rb-l"><button class="btn ghost" id="rb-pick">사건 바꾸기</button><button class="btn ghost" id="rb-leave">방 나가기</button></div></div>
    ${asking.length?`<span class="asking">${esc(asking.join(', '))} 님이 질문하는 중…</span>`:''}
    ${R.picking?`<div class="picker"><select id="rb-sel" aria-label="사건 선택">${caseOptions(R.doc?.caseIdx??0)}</select><button class="btn hl" id="rb-ok">이 사건으로 시작</button><button class="btn ghost" id="rb-cancel">취소</button></div>`:''}`;
  on('rb-copy',e=>copyText(S.roomCode,document.getElementById('rb-copy')));
  on('rb-pick',()=>{R.picking=!R.picking;renderRoomBar()});
  on('rb-cancel',()=>{R.picking=false;renderRoomBar()});
  on('rb-ok',()=>{const v=+document.getElementById('rb-sel').value;R.picking=false;changeRoomCase(v)});
  on('rb-leave',()=>{leaveRoom();S.view="rooms";render()});
}
function copyText(t,btn){const done=()=>{if(btn){const o=btn.textContent;btn.textContent="복사했어";setTimeout(()=>btn.textContent=o,1400)}};
  try{navigator.clipboard.writeText(t).then(done,()=>{if(btn)btn.textContent=t})}catch(e){if(btn)btn.textContent=t}}

function ago(t){const m=Math.max(0,Math.round((Date.now()-(t||0))/60000));return m<1?"방금":m<60?`${m}분 전`:m<1440?`${Math.round(m/60)}시간 전`:`${Math.round(m/1440)}일 전`}

function go(where){
  if(busy&&where!=="game")ctl?.abort();
  if(S.view==="rooms"&&where!=="rooms"&&openRoomsUnsub){openRoomsUnsub();openRoomsUnsub=null}
  roomMsg="";
  if(where==="menu")S.view="intro";
  else if(where==="start"){S.view="pick";S.genre=CASES[S.cur]?.g||"crime"}
  else if(where==="rooms"&&ROOMS_SOON)return;
  else if(where==="continue"){const l=S.last;if(!l||(ROOMS_SOON&&l.t==="room"))return;if(l.t==="room"){enterRoom(l.c);return}startSolo(l.i);return}
  else S.view=where;
  render();window.scrollTo({top:0});
}
function startSolo(k){if(!CASES[k]||CASES[k].soon)return;if(S.mode==="room")leaveRoom();S.mode="solo";S.cur=k;S.view="game";mode="q";statusMsg="";setLast({t:"solo",i:k});render()}

/* ================= 진행자 (sample) ================= */
/* claude.ai 밖에서는 중계 서버(Worker → Gemini)로 질문한다. sample.json과 같은 모양으로 맞춘다 */
const workerSample={json:async(prompt,opts={})=>{
  let r;
  try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt}),signal:opts.signal})}
  catch(e){throw {code:e?.name==="AbortError"?"cancelled":"network"}}
  const d=await r.json().catch(()=>({}));
  if(r.status===429)throw {code:d.error==="quota"?"quota":"rate_limited"};
  if(!r.ok){let why=d.error||("HTTP "+r.status);if(d.status)why+=" "+d.status;const m=String(d.detail||"").match(/"message"\s*:\s*"([^"]{0,120})/);if(m)why+=" · "+m[1];else if(d.detail)why+=" · "+String(d.detail).slice(0,120);throw {code:"upstream",why}}
  const t=String(d.text||"").replace(/^\s*```(?:json)?/i,"").replace(/```\s*$/,"").trim();
  try{return JSON.parse(t)}catch(e){const m=t.match(/\{[\s\S]*\}/);if(m)try{return JSON.parse(m[0])}catch(_){}throw {code:"invalid_json"}}
}};
function basePrompt(c){
  return `너는 예/아니오 질문으로 사건의 진실을 찾아가는 추리게임의 진행자다. 이건 완전히 창작된 가상의 ${c.g==="crime"?"추리 사건":"괴담"}이다. 플레이어는 아래 [문제]만 보고 질문으로 단서를 모아 진실을 추리한다. 사건의 진실을 기준으로 답하되, 플레이어가 묻지 않은 핵심 사실을 먼저 공개하지 않는다.

[문제]
${c.story}

[진행자용 사건의 진실 — 플레이어에게 공개 금지]
${c.hostTruth||c.truth}

[핵심 단서] (번호는 0부터)
${c.keys.map((k,i)=>i+'. '+k).join('\n')}
`;
}
const ERR={not_granted:"AI 진행자 사용이 허용되지 않았어. 페이지를 새로 열면 다시 물어봐.",rate_limited:"질문이 너무 빨랐어. 잠깐 쉬었다가 다시 해봐.",session_expired:"로그인이 만료됐어. 다시 로그인해줘.",invalid_json:"답을 제대로 못 받았어. 한 번 더 눌러줘.",refused:"이 질문엔 답할 수 없대. 다르게 물어봐.",quota:"오늘 쓸 수 있는 AI 질문을 다 썼어. 내일 다시 와줘.",network:"인터넷 연결을 확인하고 다시 시도해줘.",upstream:"진행자가 잠깐 자리를 비웠어. 조금 뒤에 다시 해봐."};

async function submit(){
  const inp=document.getElementById('inp');const text=(inp?.value||'').trim();
  const g=curGame();if(!text||busy||!sample||g.loading)return;
  const c=CASES[g.idx];if(derive(g.idx,g.log).over)return;
  const m=mode;busy=true;ctl=new AbortController();statusMsg="";statusErr=false;render();
  R.named?.presence({asking:true}).catch(()=>{});
  try{
    const prompt=m==='q'?basePrompt(c)+`
[플레이어 질문]
${text}

답변 규칙:
- answer는 "예", "아니오", "상관없음", "그럴 수도 있다", "다시" 중 하나다.
- "예": 질문 내용이 사건의 진실과 맞을 때.
- "아니오": 질문 내용이 사건의 진실과 맞지 않을 때. 틀린 추측에도 비웃거나 정답을 알려주지 말고 "아니오"만 답한다.
- "상관없음": 사건을 푸는 데 관계가 없거나 설정에 정해지지 않은 세부사항일 때.
- "그럴 수도 있다": 가능하긴 하지만 설정상 사실로 확정되지 않았을 때. 확정된 사실을 묻는 질문에는 쓰지 않는다.
- "다시": 질문이 여러 의미로 해석될 수 있어 판단할 수 없을 때. 임의로 뜻을 정하지 않는다.
- 기준 답변 목록이 있으면 그와 같은 뜻의 질문에는 같은 답을 한다.
- note는 꼭 필요할 때만 짧은 한 문장(30자 이내). 묻지 않은 단서나 정답을 절대 흘리지 않는다. 보통은 빈 문자열.
- found에는 이 질문이 "예"로 확인한 핵심 단서 번호만 넣는다. 단서 내용을 거의 그대로 짚었을 때만 인정한다.
JSON 하나만 답해: {"answer":"예","note":"","found":[0]}`
    :basePrompt(c)+`
[플레이어의 추리]
${text}

판정 규칙:
- ${c.solve||"추리가 숨은 진실의 핵심(왜 그런 일이 생겼는지)을 맞혔으면 정답, 방향은 맞는데 중요한 이유가 빠졌으면 거의 맞음."}
- 그 외에는 "아직".
- found에는 추리가 맞힌 핵심 단서 번호.
- comment는 25자 이내. "정답"이 아니면 무엇이 빠졌는지도 말하지 말고, 진실을 흘리지 않는 격려만 한다.
JSON 하나만 답해: {"result":"아직","found":[],"comment":"좋은 방향이야, 더 파봐"}`;
    const r=await sample.json(prompt,{modelTier:SET.tier,signal:ctl.signal});
    const found=Array.isArray(r?.found)?r.found.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<c.keys.length):[];
    let entry;
    if(m==='q'){const allowed=["예","아니오","상관없음","그럴 수도 있다","다시"];const a=allowed.includes(r?.answer)?r.answer:"상관없음";
      entry={kind:"q",text,answer:a,note:a==="다시"?"어떤 의미로 물어본 건지 조금 더 구체적으로 질문해줘.":String(r?.note||"").slice(0,50),found:a==="예"?found:[]};}
    else{const res=["정답","거의 맞음","아직"].includes(r?.result)?r.result:"아직";entry={kind:"g",text,answer:res,note:String(r?.comment||"").slice(0,60),found}}
    clearInp=true;busy=false;
    await addEntry(entry);
  }catch(e){
    busy=false;
    if(e?.code==="cancelled"){render();return}
    if(e?.code==="not_granted"||e?.code==="sampling_disabled")sampleState="none";
    else{statusMsg=(ERR[e?.code]||"진행자 연결이 끊겼어. 다시 시도해줘.")+(e?.why?` (${e.why})`:"");statusErr=true}
    render();
  }finally{R.named?.presence({asking:false}).catch(()=>{});focusInp()}
}

async function addEntry(e){
  const g=curGame();if(g.loading)return;
  const full={kind:e.kind,text:String(e.text||"").slice(0,200),answer:e.answer||"",note:e.note||"",found:e.found||[],at:Date.now()};
  freshAt=full.at;
  if(!g.room){(S.solo[g.idx]=S.solo[g.idx]||[]).push(full);saveSolo();render();return}
  try{full.by=me.id;await db.collection(`rooms/${S.roomCode}/rounds/${R.round}/log`).add(full);render()}
  catch(err){statusMsg=err?.code==="invalid_argument"?"이 방에 기록할 권한이 없어. 공유한 사람에게 '참여자' 권한을 받아야 해.":err?.code==="quota_exceeded"?"저장 공간이 꽉 찼어.":"기록을 저장하지 못했어. 다시 시도해줘.";statusErr=true;render()}
}

/* ================= 방 (db + room) ================= */
const CODE_CH="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const validCode=c=>/^[A-Z0-9]{4}$/.test(c);
async function createRoom(){
  if(!db)return;const k=+document.getElementById('new-case').value;
  roomMsg="";const btn=document.getElementById('create');if(btn){btn.disabled=true;btn.textContent="만드는 중…"}
  try{
    let code;for(let i=0;i<6;i++){code=Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');if(!(await db.doc("rooms/"+code).get()).exists)break}
    await db.doc("rooms/"+code).set({caseIdx:k,round:rid(),by:me.id,at:Date.now()});
    enterRoom(code);
  }catch(e){roomMsg=e?.code==="invalid_argument"?"방을 만들 권한이 없어. 공유한 사람에게 '참여자' 권한을 받아야 해.":"방을 만들지 못했어. 다시 시도해줘.";render()}
}
async function enterRoom(raw){
  const code=String(raw||"").trim().toUpperCase();
  if(!validCode(code)){roomMsg="코드는 영문과 숫자 4자리야.";S.view="rooms";render();return}
  if(!db){roomMsg="방 기능은 claude.ai에 로그인한 상태에서만 쓸 수 있어.";S.view="rooms";render();return}
  if(S.roomCode===code&&S.mode==="room"){S.view="game";render();return}
  try{const s=await db.doc("rooms/"+code).get();if(!s.exists){roomMsg=`${code} 방을 찾을 수 없어.`;S.view="rooms";render();return}}
  catch(e){roomMsg="방을 불러오지 못했어. 다시 시도해줘.";S.view="rooms";render();return}
  leaveRoom();
  if(openRoomsUnsub){openRoomsUnsub();openRoomsUnsub=null}
  S.mode="room";S.roomCode=code;S.view="game";R.code=code;mode="q";statusMsg="";setLast({t:"room",c:code});
  C.room=[];C.loaded.room=false;C.tab="room";C.seen.room=Date.now();
  R.unsubs.push(db.doc("rooms/"+code).onSnapshot(snap=>{
    if(!snap.exists){R.err="방이 사라졌어.";R.doc=null;render();return}
    const d=snap.data();if(!Number.isInteger(d.caseIdx)||d.caseIdx<0||d.caseIdx>=CASES.length)return;
    const changed=d.round!==R.round;R.doc=d;
    if(changed){R.round=d.round;R.log=[];R.logUnsub?.();
      R.logUnsub=db.collection(`rooms/${code}/rounds/${d.round}/log`).orderBy("at").limit(200).onSnapshot(s=>{R.log=s.docs.map(x=>x.data());if(S.view==="game"&&S.mode==="room")render()},()=>{})}
    if(S.view==="game")render();
  },()=>{R.err="방 정보를 불러오지 못했어.";render()}));
  R.unsubs.push(db.collection(`rooms/${code}/chat`).orderBy("at","desc").limit(120).onSnapshot(s=>onChat("room",s),()=>{}));
  if(room)room.join("r-"+code.toLowerCase()).then(n=>{
    if(S.roomCode!==code){n.leave().catch(()=>{});return}
    R.named=n;n.presence({asking:false}).catch(()=>{});
    R.unsubs.push(n.onPeers(ch=>{R.peers=ch.peers;ensureNames(ch.peers.map(p=>p.by));renderRoomBar()},()=>{}));
  }).catch(()=>{});
  render();window.scrollTo({top:0});
}
function leaveRoom(){
  R.unsubs.forEach(u=>{try{u()}catch(e){}});R.logUnsub?.();R.named?.leave().catch(()=>{});
  Object.assign(R,{code:null,doc:null,round:null,log:[],peers:[],unsubs:[],logUnsub:null,named:null,picking:false,err:""});
  if(S.mode==="room"){S.mode="solo";S.roomCode=null}
  C.room=[];C.ids.room=[];C.tab="lobby";
}
async function changeRoomCase(k){
  if(!db||!S.roomCode)return;
  try{await db.doc("rooms/"+S.roomCode).update({caseIdx:k,round:rid(),at:Date.now()})}
  catch(e){statusMsg=e?.code==="invalid_argument"?"사건을 바꿀 권한이 없어.":"사건을 바꾸지 못했어.";statusErr=true;render()}
}

/* ================= 이름 ================= */
function ensureNames(ids){if(!user)return;const miss=[...new Set(ids.filter(i=>i&&!(i in NAMES)))];if(!miss.length)return;
  miss.forEach(i=>NAMES[i]=null);
  user.profiles(miss).then(ps=>{for(const id in ps)NAMES[id]=ps[id];if(S.view==="game")render();else renderChat();renderRoomBar()})}

/* ================= 채팅 ================= */
const chatEl=document.getElementById('chat'),chatList=document.getElementById('chatList'),chatNote=document.getElementById('chatNote'),chatInp=document.getElementById('chatInp');
function onChat(ch,s){
  const first=!C.loaded[ch];C.loaded[ch]=true;
  C.ids[ch]=s.docs.map(d=>d.id);C[ch]=s.docs.map(d=>d.data()).reverse();
  if(!first){const n=s.docChanges().filter(x=>x.type==="added"&&x.doc.data()?.by!==me.id&&(x.doc.data()?.at||0)>C.seen[ch]).length;
    if(n&&!(C.open&&C.tab===ch))C.unread+=n}
  ensureNames(C[ch].map(m=>m.by));renderChat();
}
let chatLastLen=-1,chatLastTab="";
function renderChat(){
  const inRoom=S.mode==="room"&&!!S.roomCode;
  if(!inRoom&&C.tab==="room")C.tab="lobby";
  document.getElementById('ct-lobby').setAttribute('aria-pressed',C.tab==="lobby");
  const rt=document.getElementById('ct-room');rt.setAttribute('aria-pressed',C.tab==="room");rt.disabled=!inRoom;rt.textContent=inRoom?`방 ${S.roomCode}`:"이 방";
  const ub=document.getElementById('unread');ub.hidden=!C.unread;ub.textContent=C.unread>99?"99+":C.unread;
  document.getElementById('chatFab').hidden=!S.lit||C.open||!db;
  chatEl.hidden=!C.open||!db;
  if(!C.open)return;
  const msgs=C[C.tab]||[];
  const nearBottom=chatList.scrollHeight-chatList.scrollTop-chatList.clientHeight<80;
  chatList.innerHTML=!db?`<p class="chat-empty">채팅은 claude.ai에 로그인한 상태에서 열어야 쓸 수 있어.</p>`
    :msgs.length?msgs.map(m=>{const p=NAMES[m.by];const mine=m.by&&m.by===me.id;
      return `<div class="msg ${mine?'mine':''}">${p?.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`:`<span class="ph"></span>`}<div><div class="mh"><b>${esc(p?.name||(mine?'나':'누군가'))}</b><time>${esc(hhmm(m.at))}</time></div><p>${esc(m.text)}</p></div></div>`}).join('')
    :`<p class="chat-empty">${C.tab==="room"?"이 방엔 아직 대화가 없어.":"로비가 조용해. 먼저 인사해봐."}</p>`;
  if(nearBottom||chatLastTab!==C.tab||chatLastLen<0)chatList.scrollTop=chatList.scrollHeight;
  chatLastLen=msgs.length;chatLastTab=C.tab;
  const canSend=!!db&&!!me.id&&!C.readonly;
  chatNote.textContent=!db?"":!me.id?"로그인 정보가 없어서 읽기만 할 수 있어.":C.readonly?"보기 권한이라 메시지를 보낼 수 없어. 공유한 사람에게 '참여자' 권한을 받아야 해.":"";
  chatInp.disabled=!canSend;document.getElementById('chatSend').disabled=!canSend;
}
function hhmm(t){if(!t)return"";const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
function openChat(){C.open=true;C.unread=0;C.seen[C.tab]=Date.now();chatLastLen=-1;renderChat();setTimeout(()=>{if(!chatInp.disabled)chatInp.focus()},30)}
document.getElementById('chatFab').onclick=openChat;
document.getElementById('chatClose').onclick=()=>{C.open=false;C.seen.lobby=C.seen.room=Date.now();renderChat()};
document.querySelectorAll('.ctabs button').forEach(b=>b.onclick=()=>{if(b.disabled)return;C.tab=b.dataset.ch;C.seen[C.tab]=Date.now();renderChat()});
document.getElementById('chatForm').onsubmit=async e=>{
  e.preventDefault();const text=chatInp.value.trim();if(!text||!db||!me.id)return;
  const ch=C.tab,path=ch==="room"?`rooms/${S.roomCode}/chat`:"lobby/main/chat";
  chatInp.value="";
  try{await db.collection(path).add({text:text.slice(0,300),by:me.id,at:Date.now()});
    const ids=C.ids[ch];if(ids.length>=120){for(const id of ids.slice(100)){try{await db.doc(path+"/"+id).delete()}catch(e){}}}}
  catch(err){if(err?.code==="invalid_argument")C.readonly=true;else chatNote.textContent="메시지를 보내지 못했어. 다시 시도해줘.";chatInp.value=text;renderChat()}
};
document.addEventListener('keydown',e=>{if(e.key==="Escape"){const z=document.getElementById('zoom');if(!z.hidden){z.hidden=true;return}if(C.open){C.open=false;renderChat()}}});

/* ================= 시작 ================= */
function start(saved){
  if(saved&&typeof saved==="object"&&saved.view){
    ["view","lit","genre","cur","hintSeen"].forEach(k=>{if(k in saved)S[k]=saved[k]});
    if(S.view==="intro")S.lit=false;
    if(saved.solo)S.solo=saved.solo;
    if(!(S.cur>=0&&S.cur<CASES.length))S.cur=0;if(S.last?.t==="solo"&&!(S.last.i<CASES.length))setLast(null);
    if(saved.mode==="room"&&saved.roomCode&&!ROOMS_SOON){S.view="rooms";S.pendingRoom=saved.roomCode}
    if(ROOMS_SOON&&(S.view==="rooms"||saved.mode==="room"))S.view="intro";
    if(S.view==="game"&&CASES[S.cur]?.soon)S.view="pick";
    if(S.view==="intro")S.lit=false;
  }
  if(LS.get("soup.case2",null)!=="C-0904"){delete S.solo[1];saveSolo();if(S.last?.t==="solo"&&S.last.i===1)setLast(null);LS.set("soup.case2","C-0904")}
  applySettings();render();
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  use("sample").then(fn=>{
    if(fn){sample=fn;sampleState="ok"}
    else if(API_URL){sample=workerSample;backend="worker";sampleState="ok"}
    else sampleState="none";
    render()});
  use("room").then(r=>{room=r});
  Promise.all([use("user"),use("db")]).then(async([u,d])=>{
    user=u;db=d;if(u){try{me=await u.me()}catch(e){}}
    if(db){db.collection("lobby/main/chat").orderBy("at","desc").limit(120).onSnapshot(s=>onChat("lobby",s),()=>{C.err=true})}
    if(S.pendingRoom){const c=S.pendingRoom;delete S.pendingRoom;enterRoom(c)}else render();
  });
}
window.claude?.hot?.snapshot?.(()=>({view:S.view==="game"&&S.mode==="room"?"rooms":S.view,lit:S.lit,genre:S.genre,cur:S.cur,mode:S.mode,roomCode:S.roomCode,solo:S.solo,hintSeen:S.hintSeen}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
